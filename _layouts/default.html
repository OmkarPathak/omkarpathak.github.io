---
layout: compress
---

<!DOCTYPE html>
<html lang="en-us">
    {% include head.html %}
    <body>
        <a class="skip" href="#main">Skip to content</a>
        {% assign current = page.url | downcase | split: '/' %}
        {% assign sec = current[1] %}
        <header class="nav">
            <div class="w">
                <div class="lights"><i></i><i></i><i></i></div>
                <a class="brand" href="{{ '/' | relative_url }}">omkar<i>.</i>dev</a>
                <nav class="links" aria-label="Primary">
                    <a href="{{ '/experience/' | relative_url }}"{% if sec == 'experience' %} aria-current="page"{% endif %}>Experience</a>
                    <a href="{{ '/projects/' | relative_url }}"{% if sec == 'projects' %} aria-current="page"{% endif %}>Projects</a>
                    <a href="{{ '/portfolio/' | relative_url }}"{% if sec == 'portfolio' or sec == 'photography' or sec == 'sketching' or sec == 'illustrations' or sec == 'freelancing' %} aria-current="page"{% endif %}>Art</a>
                    <a href="{{ '/blog/' | relative_url }}"{% if sec == 'blog' %} aria-current="page"{% endif %}>Blog</a>
                    <a href="{{ '/downloads/OmkarResume.pdf' | relative_url }}" target="_blank" rel="noopener">Resume</a>
                    <a href="{{ '/contact/' | relative_url }}"{% if sec == 'contact' %} aria-current="page"{% endif %}>Contact</a>
                </nav>
                <button class="mbtn" popovertarget="menu" aria-label="Open menu"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            </div>
        </header>
        <div id="menu" popover class="menu">
            <button class="mclose" popovertarget="menu" popovertargetaction="hide" aria-label="Close menu"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            <nav aria-label="Mobile">
                <a href="{{ '/experience/' | relative_url }}">Experience</a>
                <a href="{{ '/projects/' | relative_url }}">Projects</a>
                <a href="{{ '/portfolio/' | relative_url }}">Art</a>
                <a href="{{ '/blog/' | relative_url }}">Blog</a>
                <a href="{{ '/downloads/OmkarResume.pdf' | relative_url }}" target="_blank" rel="noopener">Resume</a>
                <a href="{{ '/contact/' | relative_url }}">Contact</a>
            </nav>
        </div>
        <main id="main">
{{ content }}
        </main>
        {% include footer.html %}
    </body>
</html>
