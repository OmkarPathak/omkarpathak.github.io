<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Manifest file -->
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

  <!-- SEO -->
  {% seo %}

  <!-- Icons -->
  <link rel="shortcut icon" href="{{ 'public/icon-192x192.png' | relative_url }}">
  <link rel="icon" sizes="192x192" href="{{ 'public/icon-192x192.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ 'public/icon-192x192.png' | relative_url }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Omii">
  <meta name="apple-mobile-web-app-title" content="Omii">
  <meta name="theme-color" content="#C05827">
  <meta name="msapplication-navbutton-color" content="#C05827">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-starturl" content="/">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
  <link rel="preload" href="{{ '/public/fonts/bricolage-grotesque-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/public/css/site.css' | relative_url }}">

  {% if page.math %}
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
  {% endif %}
</head>
