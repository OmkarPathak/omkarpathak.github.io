<div id="disqus_thread"></div>
<script>
  /* Disqus loads only when the comments area scrolls into view, so it never affects page load. */
  (function() {
    var el = document.getElementById('disqus_thread');
    function load() {
      var d = document, s = d.createElement('script');
      s.src = 'https://omkarpathak.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(es) { if (es[0].isIntersecting) { io.disconnect(); load(); } }, { rootMargin: '300px' });
      io.observe(el);
    } else { load(); }
  })();
</script>
