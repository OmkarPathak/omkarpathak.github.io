---
layout: wide
title: Tag
---
<div class="page-hero"><div class="w"><p class="crumb"><a href="/blog/">Blog</a> / Tags</p><p class="eyebrow">blog.md</p><h1>Tag</h1></div></div>
<section style="padding-top:20px"><div class="w" style="max-width:860px">
{% assign tags = site.tags | sort %}
<div class="chips big" style="margin:0 0 20px">{% for tag in tags %}<a class="chip" href="#{{ tag[0] | slugify }}"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/></svg> {{ tag[0] }}</a>{% endfor %}</div>
{% for tag in tags %}<div class="tagsec" id="{{ tag[0] | slugify }}"><h2><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/></svg> {{ tag[0] }}</h2><ul class="arch">
{% for post in tag[1] %}<li><time>{{ post.date | date_to_string }}</time><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></li>{% endfor %}
</ul></div>{% endfor %}
</div></section>
