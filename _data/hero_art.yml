# Images shown in the "art.svg" tab of the home page editor.
# To change them: put your originals in public/img/hero/, run
#   python3 scripts/optimize_hero_images.py
# and paste the printed paths below.
#   alt: accessibility text
#   pos: (optional) which part of the picture stays visible when it is cropped to a square,
#        as "x% y%" (50% 50% = centre, 50% 0% = top).
main:
  image: /public/img/hero/web/ganpati-modak.webp
  alt: Illustration of baby Ganpati with modaks and a mouse
  pos: 50% 40%
thumbs:
  - image: /public/img/hero/web/wedding-swaralee-omkar.webp
    alt: Wedding illustration of Swaralee and Omkar
    pos: 50% 32%
  - image: /public/img/hero/web/ganpati-leaf.webp
    alt: Illustration of Ganpati sleeping on a leaf
    pos: 50% 50%
  - image: /public/img/hero/web/puppy.webp
    alt: Watercolour sketch of a puppy
    pos: 50% 55%
  - image: /public/img/hero/web/pig-sweater.webp
    alt: Watercolour sketch of a pig in a sweater
    pos: 50% 45%
